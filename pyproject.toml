[project]
name = "bitacora-medica"
version = "0.1.0"
description = "Sistema automatizado de bitácora de guardia médica, gestión de pendientes clínicos y recordatorios nocturnos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "jinja2>=3.1.3",
    "typer>=0.12.3",
    "rich>=13.7.1",
    "tabulate>=0.9.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "openpyxl>=3.1.2",
    "google-api-python-client>=2.120.0",
    "google-auth>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.9.0",
    "ruff>=0.4.0",
    "types-tabulate>=0.9.0.20240106",
]

[project.scripts]
bitacora = "bitacora.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bitacora"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true
